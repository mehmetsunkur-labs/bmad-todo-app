# Production static server for the built SPA (AD-9: same-origin delivery).
# The SPA and the API share one origin, so no CORS headers are ever sent.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # SPA fallback: unknown paths get index.html; the client renders the route.
    location / {
        try_files $uri /index.html;
    }

    # The entry document must be revalidated so a new deploy is picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite emits content-hashed file names here, so they never change.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Same-origin API proxy. No URI part on proxy_pass, so /api/... reaches
    # the API unchanged (no prefix is stripped). The upstream is a variable so
    # nginx re-resolves `api` through Docker's embedded DNS at request time
    # (cached for 10 s) instead of pinning the IP it saw at startup; a
    # recreated api container on a new IP keeps working without restarting web.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        # Fail fast (well inside the client's 10 s timeout) when api is down.
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
