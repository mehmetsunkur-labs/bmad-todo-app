# Base topology shared by dev and the production-like stack (AD-10).
# Production-like stack: `docker compose -f compose.yaml up -d` (nginx serving
# the built SPA, the production API, PostgreSQL; only web publishes a port).
# After pulling or changing code, use `up -d --build`, or the old images run.
# `docker compose up` also loads compose.override.yaml (the dev stack).
# Each mode tags its own images (:prod here, :dev in the override), so one
# mode never reuses the other's build. The test harnesses set TODOS_IMAGE_TAG
# (smoke, e2e) so they never rebuild these tags; leave it unset yourself.
name: todos

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      # postgres:18 image layout: mount the parent dir; PGDATA is never set.
      - todos-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    image: todos-api:${TODOS_IMAGE_TAG:-prod}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: todos-web:${TODOS_IMAGE_TAG:-prod}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      - api

volumes:
  todos-data:
