# Dev stack, loaded automatically by `docker compose up`:
# Vite HMR, tsx watch with the inspector, db port, and the todos_test database.
services:
  db:
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro

  api:
    image: todos-api:${TODOS_IMAGE_TAG:-dev}
    build:
      target: dev
    command:
      [
        "./node_modules/.bin/tsx",
        "watch",
        "--inspect=0.0.0.0:9229",
        "src/server.ts",
      ]
    ports:
      - "127.0.0.1:9229:9229"
    volumes:
      - .:/app
      # Anonymous volumes: they keep the image's node_modules over the bind
      # mount, and `docker compose up --build -V` renews them from the new image.
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/shared/node_modules

  web:
    image: todos-web:${TODOS_IMAGE_TAG:-dev}
    build:
      target: dev
    command:
      [
        "./node_modules/.bin/vite",
        "--host",
        "0.0.0.0",
        "--port",
        "8080",
        "--strictPort",
      ]
    # AD-10: the dev server (source, HMR, dev data) binds loopback by default.
    # DEV_WEB_HOST=0.0.0.0 in .env opts into the LAN (for example a phone), and
    # DEV_ALLOWED_HOSTS lists extra host names Vite accepts. `!override`
    # replaces compose.yaml's all-interfaces port (Compose 2.24.4 or later).
    ports: !override
      - "${DEV_WEB_HOST:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    environment:
      API_PROXY_TARGET: http://api:3000
      DEV_ALLOWED_HOSTS: ${DEV_ALLOWED_HOSTS:-}
    volumes:
      - .:/app
      # Anonymous volumes: they keep the image's node_modules over the bind
      # mount, and `docker compose up --build -V` renews them from the new image.
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/shared/node_modules
